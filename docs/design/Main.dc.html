<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>ToneForge · Biblioteca</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=Space+Grotesk:wght@500;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#0F1113}
a{color:#F2A33A}a:hover{color:#FFC170}
</style>
</helmet>
<div style="display: flex; flex-wrap: wrap; min-height: 900px; background: #0F1113; color: #E8EAED; font-family: Inter, system-ui, sans-serif; font-size: 14px">
<nav aria-label="Secciones" style="flex: 1 1 220px; max-width: 240px; background: #15181B; border-right: 1px solid #252A2F; padding: 24px 16px; display: flex; flex-direction: column; gap: 4px; box-sizing: border-box">
<div style="font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 22px; padding: 0 12px 20px">Tone<span style="color: #F2A33A">Forge</span></div>
<sc-for list="{{nav}}" as="n" hint-placeholder-count="7">
<a href="{{n.href}}" style="{{n.style}}">{{n.label}}</a>
</sc-for>
<a href="Settings.dc.html" style="margin-top: auto; display: flex; align-items: center; gap: 10px; height: 44px; padding: 0 12px; border-radius: 10px; text-decoration: none; font-weight: 500; color: #C9CED4"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>Ajustes</a>
<div style="margin-top: 8px; padding: 12px; border-radius: 10px; background: #1C2024; display: flex; flex-direction: column; gap: 6px">
<div style="display: flex; align-items: center; gap: 8px"><span aria-hidden="true" style="width: 8px; height: 8px; border-radius: 50%; background: #4CC38A"></span><span style="font-weight: 600">Flex Prime</span></div>
<div style="color: #9AA3AD; font-size: 12px">USB audio · Remote Editor por Wi-Fi</div>
</div>
</nav>
<main style="flex: 999 1 560px; min-width: 0; padding: 32px 40px; box-sizing: border-box; display: flex; flex-direction: column; gap: 24px">
<div style="display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 16px">
<div>
<h1 style="margin: 0; font-family: 'Space Grotesk', sans-serif; font-size: 32px; font-weight: 700">Biblioteca</h1>
<p style="margin: 6px 0 0; color: #9AA3AD">Tus temas, sus guitarras separadas y los rigs igualados.</p>
</div>
<div style="display: flex; gap: 12px">
<label style="display: flex; align-items: center; gap: 8px; background: #1C2024; border: 1px solid #2A3036; border-radius: 10px; padding: 0 14px; height: 44px">
<svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#9AA3AD" stroke-width="2"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-4-4"></path></svg>
<input type="search" placeholder="Buscar tema o grupo" style="background: transparent; border: 0; color: #E8EAED; font: inherit; outline: none; width: 200px">
</label>
<button style="height: 44px; padding: 0 20px; border-radius: 10px; border: 0; background: #F2A33A; color: #1A1206; font: 600 14px Inter, sans-serif; cursor: pointer">Importar tema</button>
</div>
</div>
<div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 16px">
<sc-for list="{{stats}}" as="s" hint-placeholder-count="4">
<div style="background: #171A1D; border: 1px solid #252A2F; border-radius: 14px; padding: 18px 20px">
<div style="color: #9AA3AD; font-size: 12px; text-transform: uppercase; letter-spacing: 0.06em">{{s.label}}</div>
<div style="font-family: 'Space Grotesk', sans-serif; font-size: 28px; font-weight: 700; margin-top: 6px">{{s.value}}</div>
</div>
</sc-for>
</div>
<div style="background: #171A1D; border: 1px solid #252A2F; border-radius: 14px; overflow-x: auto">
<table style="width: 100%; border-collapse: collapse; min-width: 760px">
<thead>
<tr style="text-align: left; color: #9AA3AD; font-size: 12px; text-transform: uppercase; letter-spacing: 0.06em">
<th style="padding: 14px 20px; font-weight: 500">Tema</th>
<th style="padding: 14px 20px; font-weight: 500">Guitarras</th>
<th style="padding: 14px 20px; font-weight: 500">Rigs</th>
<th style="padding: 14px 20px; font-weight: 500">Tomas</th>
<th style="padding: 14px 20px; font-weight: 500">Estado</th>
<th style="padding: 14px 20px; font-weight: 500"><span style="position: absolute; left: -9999px">Acciones</span></th>
</tr>
</thead>
<tbody>
<sc-for list="{{songs}}" as="t" hint-placeholder-count="5">
<tr style="border-top: 1px solid #252A2F">
<td style="padding: 16px 20px"><div style="font-weight: 600">{{t.title}}</div><div style="color: #9AA3AD; font-size: 13px; margin-top: 2px">{{t.band}}</div></td>
<td style="padding: 16px 20px; color: #C9CED4">{{t.guitars}}</td>
<td style="padding: 16px 20px; color: #C9CED4">{{t.rigs}}</td>
<td style="padding: 16px 20px; color: #C9CED4">{{t.takes}}</td>
<td style="padding: 16px 20px"><span style="{{t.chip}}">{{t.status}}</span></td>
<td style="padding: 16px 20px; text-align: right"><a href="Tone.dc.html" style="display: inline-flex; align-items: center; height: 36px; padding: 0 14px; border-radius: 8px; border: 1px solid #2A3036; color: #E8EAED; text-decoration: none">Abrir</a></td>
</tr>
</sc-for>
</tbody>
</table>
</div>
</main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
renderVals() {
var base = 'display: flex; align-items: center; height: 44px; padding: 0 12px; border-radius: 10px; text-decoration: none; font-weight: 500;';
var items = [['Biblioteca','Main.dc.html'],['Igualar tono','Tone.dc.html'],['Tablatura y DI','Tab.dc.html'],['Backing track','Backing.dc.html'],['Grabar','Record.dc.html'],['Montaje','Edit.dc.html']];
var active = 'Biblioteca';
var nav = items.map(function (i) { return { label: i[0], href: i[1], style: base + (i[0] === active ? 'background: #2A2116; color: #F2A33A;' : 'color: #C9CED4;') }; });
var chip = function (c) { return 'display: inline-block; padding: 4px 10px; border-radius: 999px; font-size: 12px; font-weight: 600; ' + c; };
var ok = chip('background: #16301F; color: #6FD99E;');
var wip = chip('background: #2A2116; color: #F2A33A;');
var neu = chip('background: #1F242A; color: #C9CED4;');
return {
nav: nav,
stats: [{ label: 'Temas', value: '5' }, { label: 'Rigs igualados', value: '7' }, { label: 'Tomas grabadas', value: '12' }, { label: 'Vídeos exportados', value: '2' }],
songs: [
{ title: 'So payaso', band: 'Extremoduro', guitars: 'Robe · Uoho · Solo', rigs: '3 de 3', takes: '3', status: 'Vídeo listo', chip: ok },
{ title: 'Jesucristo García', band: 'Extremoduro', guitars: 'Rítmica · Solo', rigs: '2 de 2', takes: '4', status: 'Montando', chip: wip },
{ title: 'Hay poco rock & roll', band: 'Platero y Tú', guitars: 'Rítmica A · Rítmica B', rigs: '1 de 2', takes: '2', status: 'Igualando', chip: wip },
{ title: 'Juliette', band: 'Platero y Tú', guitars: 'Rítmica · Solo', rigs: '1 de 2', takes: '3', status: 'Igualando', chip: wip },
{ title: 'Dolores se llamaba Lola', band: 'Los Suaves', guitars: 'Separando…', rigs: '—', takes: '—', status: 'Importado', chip: neu }
]
};
}
}
</script>
</body>
</html>
